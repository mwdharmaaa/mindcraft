<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M3 12h6m6 0h6M12 3v6m0 6v6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindCraft - High-Performance Mind Mapping Canvas</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #09090b !important;
        color: #f4f4f5;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .fallback-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        text-align: center;
        padding: 24px;
      }
      .fallback-card {
        background: #18181b;
        border: 1px solid #27272a;
        padding: 24px 32px;
        border-radius: 16px;
        max-width: 440px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .code-badge {
        display: inline-block;
        background: #27272a;
        color: #60a5fa;
        font-family: monospace;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 6px;
        margin: 4px 0;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] antialiased overflow-hidden select-none">
    <div id="root">
      <div class="fallback-box">
        <div class="fallback-card">
          <h2 style="margin: 0 0 8px 0; font-size: 18px; font-weight: 600; color: #f4f4f5;">MindCraft Canvas</h2>
          <p id="fallback-desc" style="margin: 0 0 16px 0; font-size: 13px; color: #a1a1aa; line-height: 1.5;">
            Loading interactive canvas components...
          </p>
          <div id="file-protocol-warning" style="display: none; font-size: 12px; color: #cbd5e1; text-align: left; border-top: 1px solid #27272a; padding-top: 14px;">
            <p style="margin: 0 0 8px 0; color: #fbbf24; font-weight: 500;">Direct file opening detected</p>
            <p style="margin: 0 0 8px 0;">Modern ES Modules cannot be executed via the <code>file://</code> protocol. Please start the local server:</p>
            <div style="background: #09090b; padding: 10px 12px; border-radius: 8px; border: 1px solid #27272a;">
              <code style="color: #38bdf8;">npm run dev</code>
              <div style="color: #71717a; font-size: 11px; margin-top: 4px;">or double-click <code>run.bat</code></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('fallback-desc').style.display = 'none';
        document.getElementById('file-protocol-warning').style.display = 'block';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

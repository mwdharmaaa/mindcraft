<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M3 12h6m6 0h6M12 3v6m0 6v6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindCraft - High-Performance Mind Mapping Canvas</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #09090b !important;
        color: #f4f4f5;
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .instant-canvas-skeleton {
        width: 100%;
        height: 100%;
        background-color: #09090b;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
        background-size: 20px 20px;
        position: relative;
      }
      #direct-file-banner {
        display: none;
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #18181b;
        border: 1px solid #3f3f46;
        padding: 14px 20px;
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        font-size: 13px;
        color: #f4f4f5;
        z-index: 9999;
        text-align: center;
      }
      #direct-file-banner code {
        background: #27272a;
        color: #38bdf8;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] antialiased overflow-hidden select-none">
    <div id="root">
      <div class="instant-canvas-skeleton"></div>
      <div id="direct-file-banner">
        Canvas requires local HTTP server. Run <code>npm run dev</code> or double-click <code>run.bat</code>.
      </div>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('direct-file-banner').style.display = 'block';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
